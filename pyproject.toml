[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pwc2dbt"
version = "0.1.0"
description = "A scoped Informatica PowerCenter XML to dbt converter"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "duckdb>=1.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pwc2dbt*"]